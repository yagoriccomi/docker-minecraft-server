# 🎮 Stack do SERVIDOR DE MINECRAFT.
#
# A REPLICAÇÃO (Syncthing) vive em `compose.sync.yaml`, num projeto Docker SEPARADO
# (`minecraft-p2p-sync`), de propósito: assim um `down` aqui NUNCA derruba a
# sincronização do mapa. Ver a seção "Resiliência" no README.
#
# Regras do projeto:
#   - Memoria da JVM: MC_MEMORY no .env (padrao 4G se ausente). Cada PC tem o seu; o .env
#     NAO vai pro git. Recomendado = 25% da RAM do PC, entre 2G e 32G. Troque pela opcao [M].
#   - Modo offline: ONLINE_MODE: "FALSE" (login via MultiMC)
#   - VERSION fixada numa release OFICIAL, casando com o cliente (NÃO usar LATEST:
#     subiria de versao sozinho e converteria o mapa sem ninguem pedir). Para trocar,
#     use a opcao [V] do menu.bat, que valida contra o manifest da Mojang.
#   - PLAYER_IDLE_TIMEOUT: "0" — ninguem e expulso por inatividade (farms de AFK)
#   - PAUSE_WHEN_EMPTY_SECONDS: "0" — o servidor NUNCA pausa sem jogadores: os chunks
#     travados com /forceload (armazem e farm de pigman) seguem rodando com ninguem online
#   - DIFFICULTY fica FORA daqui de proposito: mora no data/server.properties, que o
#     Syncthing sincroniza entre os PCs. Troque pela opcao [D] do menu.bat.
name: minecraft-p2p

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"          # Porta padrão do Minecraft Java
    environment:
      EULA: "TRUE"             # Necessário para iniciar o servidor
      TYPE: "VANILLA"
      VERSION: "26.3"          # Release oficial — troque pela opcao [V] do menu
      MEMORY: "${MC_MEMORY:-4G}"  # RAM da JVM: vem do .env (local, nao versionado). Troque pela opcao [M] do menu.bat
      ONLINE_MODE: "FALSE"     # Acesso offline via MultiMC
      PLAYER_IDLE_TIMEOUT: "0" # 0 = NUNCA expulsa por inatividade (farms de AFK)
      PAUSE_WHEN_EMPTY_SECONDS: "0" # 0 = nunca pausa sem jogadores (chunks com /forceload seguem rodando)
      USE_AIKAR_FLAGS: "TRUE"  # Flags de GC otimizadas para o heap de 4 GB
      TZ: "America/Sao_Paulo"
    volumes:
      - ./data:/data           # Volume de dados do servidor (contém o world)
    restart: unless-stopped    # Volta sozinho após reboot/queda de energia SE estava rodando.
                               # NAO volta se você parar pela opção 6 (handoff) — preserva o anti-split-brain.

  # Bot AFK: um "jogador" parado no ponto das farms que precisam de alguem por perto.
  # Fica no profile "bot": um 'up' comum NAO o liga. Quem liga e o scripts\bot.ps1, e so
  # depois que o verificador (scripts\check-bot.ps1) aprovou a versao. As paradas do menu
  # (opcoes 2 e K) e o vigia de rede o desligam junto com o servidor.
  bot:
    image: node:22-alpine
    container_name: minecraft-bot
    profiles: ["bot"]
    working_dir: /app
    command: ["sh", "-c", "npm install --omit=dev --no-audit --no-fund && node bot.js"]
    environment:
      BOT_HOST: mc
      BOT_PORT: "25565"
      RCON_PORT: "25575"
      SERVER_PROPERTIES: /mcdata/server.properties   # a senha do RCON vem daqui, nunca do git
    volumes:
      - ./bot:/app
      - ./data:/mcdata:ro      # somente leitura: o bot so le o server.properties
    depends_on:
      mc:
        condition: service_healthy
    restart: unless-stopped
